# openocd flash driver argument:
#   - option0:
#       [31:28] Flash probe type
#         0 - SFDP SDR / 1 - SFDP DDR
#         2 - 1-4-4 Read (0xEB, 24-bit address) / 3 - 1-2-2 Read(0xBB, 24-bit address)
#         4 - HyperFLASH 1.8V / 5 - HyperFLASH 3V
#         6 - OctaBus DDR (SPI -> OPI DDR)
#         8 - Xccela DDR (SPI -> OPI DDR)
#         10 - EcoXiP DDR (SPI -> OPI DDR)
#       [27:24] Command Pads after Power-on Reset
#         0 - SPI / 1 - DPI / 2 - QPI / 3 - OPI
#       [23:20] Command Pads after Configuring FLASH
#         0 - SPI / 1 - DPI / 2 - QPI / 3 - OPI
#       [19:16] Quad Enable Sequence (for the device support SFDP 1.0 only)
#         0 - Not needed
#         1 - QE bit is at bit 6 in Status Register 1
#         2 - QE bit is at bit1 in Status Register 2
#         3 - QE bit is at bit7 in Status Register 2
#         4 - QE bit is at bit1 in Status Register 2 and should be programmed by 0x31
#       [15:8] Dummy cycles
#         0 - Auto-probed / detected / default value
#         Others - User specified value, for DDR read, the dummy cycles should be 2 * cycles on FLASH datasheet
#       [7:4] Misc.
#         0 - Not used
#         1 - SPI mode
#         2 - Internal loopback
#         3 - External DQS
#       [3:0] Frequency option
#         1 - 30MHz / 2 - 50MHz / 3 - 66MHz / 4 - 80MHz / 5 - 100MHz / 6 - 120MHz / 7 - 133MHz / 8 - 166MHz
#   - option1:
#       [31:20]  Reserved
#       [19:16] IO voltage
#         0 - 3V / 1 - 1.8V
#       [15:12] Pin group
#         0 - 1st group / 1 - 2nd group
#       [11:8] Connection selection
#         0 - CA_CS0 / 1 - CB_CS0 / 2 - CA_CS0 + CB_CS0 (Two FLASH connected to CA and CB respectively)
#       [7:0] Drive Strength
#         0 - Default value

# xpi0 configs
#   - flash driver:     hpm_xpi
#   - flash ctrl index: 0xF3000000
#   - base address:     0x80000000
#   - flash size:       0x2000000
#   - flash option0:    0x7
flash bank xpi0 hpm_xpi 0x80000000 0x2000000 1 1 $_TARGET0 0xF3000000 0x7

proc init_clock {} {
    mww 0xF4000800 0xFFFFFFFF
    mww 0xF4000810 0xFFFFFFFF
    mww 0xF4000820 0xFFFFFFFF
    mww 0xF4000830 0xFFFFFFFF
    echo "clocks has been enabled!"
}

proc init_sdram { } {
    # configure femc frequency 100Mhz:
    # mux: 0x2 (pll0_clk1, default 500Mhz)
    # div: 0x4 (divided by 5)
    mww 0xF4001900 0x204

    set ioc_base 0xF4040000
    # PC00 - PC31
    for {set i 0x200} {$i < 0x3FC} {incr i 4} {
        set addr [expr {$ioc_base+$i}]
        mww $addr 0xC
    }
    # PC27 CLK
    mww [expr {$ioc_base + 0x2DC}] 0x7

    # femc configuration
    set femc_base 0xF300C000
    mww $femc_base 0x1
    sleep 10
    mww $femc_base 0x2
    mww [expr {$femc_base+8}] 0x30524
    mww [expr {$femc_base+0xc}] 0x6030524
    mww $femc_base 0x10000000

    mww [expr {$femc_base + 0x10}] 0x4000001b
    mww [expr {$femc_base + 0x14}] 0
    mww [expr {$femc_base + 0x40}] 0xf32

    # 133Mhz configuration
    #mww 0xF3050044 0x884e22
    # 166Mhz configuration
    mww [expr {$femc_base + 0x44}] 0x884e33

    mww [expr {$femc_base + 0x48}] 0x1020d0d
    mww [expr {$femc_base + 0x48}] 0x1020d0d
    mww [expr {$femc_base + 0x4C}] 0x2020300

    # config delay cell
    mww [expr {$femc_base + 0x150}] 0x3b
    mww [expr {$femc_base + 0x150}] 0x203b

    mww [expr {$femc_base + 0x094}] 0
    mww [expr {$femc_base + 0x098}] 0

    # precharge all
    mww [expr {$femc_base + 0x090}] 0x40000000
    mww [expr {$femc_base + 0x09C}] 0xA55A000F
    mww 0xF305009C 0xA55A000F
    sleep 500
    mww [expr {$femc_base + 0x03C}] 0x3
    # auto refresh
    mww [expr {$femc_base + 0x09C}] 0xA55A000C
    sleep 500
    mww [expr {$femc_base + 0x03C}] 0x3
    mww 0xF305003C 0x3
    mww [expr {$femc_base + 0x09C}] 0xA55A000C
    sleep 500
    mww [expr {$femc_base + 0x03C}] 0x3
    mww 0xF305003C 0x3

    # set mode
    mww [expr {$femc_base + 0x0A0}] 0x33
    mww [expr {$femc_base + 0x09C}] 0xA55A000A
    sleep 500
    mww [expr {$femc_base + 0x03C}] 0x3

    mww [expr {$femc_base + 0x04C}] 0x2020301
    echo "SDRAM has been initialized"
}

$_TARGET0 configure -event reset-init {
    init_clock
    init_sdram
}

$_TARGET0 configure -event gdb-attach {
    reset halt
}
