proc init_clock {} {
    mww 0xF4000800 0xFFFFFFFF
    mww 0xF4000810 0xFFFFFFFF
    mww 0xF4000820 0xFFFFFFFF
    mww 0xF4000830 0xFFFFFFFF
    echo "clocks has been enabled!"
}

proc init_sdram { } {
# configure femc frequency
# 133Mhz pll1_clk0: 266Mhz divide by 2
    #mww 0xF4001820 0x201
# 166Mhz pll2_clk0: 333Mhz divide by 2
    mww 0xF4001820 0x401
    # PC01
    mww 0xF4040208 0xC
    # PC00
    mww 0xF4040200 0xC
    # PB31
    mww 0xF40401F8 0xC
    # PB30
    mww 0xF40401F0 0xC
    # PB29
    mww 0xF40401E8 0xC
    # PB28
    mww 0xF40401E0 0xC
    # PB27
    mww 0xF40401D8 0xC
    # PB26
    mww 0xF40401D0 0xC
    # PB25
    mww 0xF40401C8 0xC
    # PB24
    mww 0xF40401C0 0xC
    # PB23
    mww 0xF40401B8 0xC
    # PB22
    mww 0xF40401B0 0xC
    # PB21
    mww 0xF40401A8 0xC
    # PB20
    mww 0xF40401A0 0xC
    # PB19
    mww 0xF4040198 0xC
    # PB18
    mww 0xF4040190 0xC

    # PD13
    mww 0xF4040368 0xC
    # PD12
    mww 0xF4040360 0xC
    # PD10
    mww 0xF4040350 0xC
    # PD09
    mww 0xF4040348 0xC
    # PD08
    mww 0xF4040340 0xC
    # PD07
    mww 0xF4040338 0xC
    # PD06
    mww 0xF4040330 0xC
    # PD05
    mww 0xF4040328 0xC
    # PD04
    mww 0xF4040320 0xC
    # PD03
    mww 0xF4040318 0xC
    # PD02
    mww 0xF4040310 0xC
    # PD01
    mww 0xF4040308 0xC
    # PD00
    mww 0xF4040300 0xC
    # PC29
    mww 0xF40402E8 0xC
    # PC28
    mww 0xF40402E0 0xC
    # PC27
    mww 0xF40402D8 0xC

    # PC22
    mww 0xF40402B0 0xC
    # PC21
    mww 0xF40402A8 0xC
    # PC17
    mww 0xF4040288 0xC
    # PC15
    mww 0xF4040278 0xC
    # PC12
    mww 0xF4040260 0xC
    # PC11
    mww 0xF4040258 0xC
    # PC10
    mww 0xF4040250 0xC
    # PC09
    mww 0xF4040248 0xC
    # PC08
    mww 0xF4040240 0xC
    # PC07
    mww 0xF4040238 0xC
    # PC06
    mww 0xF4040230 0xC
    # PC05
    mww 0xF4040228 0xC
    # PC04
    mww 0xF4040220 0xC
    
    # PC14
    mww 0xF4040270 0xC
    # PC13
    mww 0xF4040268 0xC
    # PC16
    # mww 0xF4040280 0x1000C
    # PC26
    mww 0xF40402D0 0xC
    # PC25
    mww 0xF40402C8 0xC
    # PC19
    mww 0xF4040298 0xC
    # PC18
    mww 0xF4040290 0xC
    # PC23
    mww 0xF40402B8 0xC
    # PC24
    mww 0xF40402C0 0xC
    # PC30
    mww 0xF40402F0 0xC
    # PC31
    mww 0xF40402F8 0xC
    # PC02
    mww 0xF4040210 0xC
    # PC03
    mww 0xF4040218 0xC

    # femc configuration
    mww 0xF3050000 0x1
    sleep 10
    mww 0xF3050000 0x2
    mww 0xF3050008 0x30524
    mww 0xF305000C 0x6030524
    mww 0xF3050000 0x10000000

    mww 0xF3050010 0x4000001b
    mww 0xF3050014 0
    mww 0xF3050040 0xf32

    # 133Mhz configuration
    #mww 0xF3050044 0x884e22
    # 166Mhz configuration
    mww 0xF3050044 0x884e33

    mww 0xF3050048 0x1020d0d
    mww 0xF3050048 0x1020d0d
    mww 0xF305004C 0x2020300

    # config delay cell
    mww 0xF3050150 0x3b
    mww 0xF3050150 0x203b

    mww 0xF3050094 0
    mww 0xF3050098 0

    # precharge all
    mww 0xF3050090 0x40000000
    mww 0xF305009C 0xA55A000F
    sleep 500
    mww 0xF305003C 0x3
    # auto refresh
    mww 0xF305009C 0xA55A000C
    sleep 500
    mww 0xF305003C 0x3
    mww 0xF305009C 0xA55A000C
    sleep 500
    mww 0xF305003C 0x3
    
    # set mode 
    mww 0xF30500A0 0x33
    mww 0xF305009C 0xA55A000A
    sleep 500
    mww 0xF305003C 0x3

    mww 0xF305004C 0x2020301
    echo "SDRAM has been initialized"
}

$_TARGET0 configure -event reset-init {
    init_clock
    init_sdram
}

$_TARGET0 configure -event gdb-attach {
    reset halt
}
