flash bank xpi0 hpm_xpi 0x80000000 0x2000000 1 1 $_TARGET0 0xF3040000

proc init_clock {} {
    mww 0xF4000800 0xFFFFFFFF
    mww 0xF4000810 0xFFFFFFFF
    mww 0xF4000820 0xFFFFFFFF
    mww 0xF4000830 0xFFFFFFFF
    echo "clocks has been enabled!"
}

proc init_sdram { } {
# configure femc frequency
# 166Mhz pll0_clk1: 333Mhz divide by 2
    mww 0xF4001808 0x201

    # PA25
    mww 0xF40400C8 0xC
    # PA26
    mww 0xF40400D0 0xC
    # PA27
    mww 0xF40400D8 0xC
    # PA28
    mww 0xF40400E0 0xC
    # PA29
    mww 0xF40400E8 0xC
    # PA30
    mww 0xF40400F0 0xC
    # PA31
    mww 0xF40400F8 0xC
    # PB00
    mww 0xF4040100 0xC
    # PB01
    mww 0xF4040108 0xC
    # PB02
    mww 0xF4040110 0xC
    # PB03
    mww 0xF4040118 0xC
    # PB04
    mww 0xF4040120 0xC
    # PB05
    mww 0xF4040128 0xC
    # PB06
    mww 0xF4040130 0xC
    # PB07
    mww 0xF4040138 0xC
    # PB08
    mww 0xF4040140 0xC

    # PB09
    mww 0xF4040148 0xC
    # PB10
    mww 0xF4040150 0xC
    # PB11
    mww 0xF4040158 0xC
    # PB12
    mww 0xF4040160 0xC
    # PB13
    mww 0xF4040168 0xC
    # PB14
    mww 0xF4040170 0xC
    # PB15
    mww 0xF4040178 0xC
    # PB16
    mww 0xF4040180 0xC
    # PB17
    mww 0xF4040188 0xC
    # PB18
    mww 0xF4040190 0xC
    # PB19
    mww 0xF4040198 0xC
    # PB20
    mww 0xF40401A0 0xC

    # PB21
    mww 0xF40401A8 0xC
    # PB22
    mww 0xF40401B0 0xC
    # PB23
    mww 0xF40401B8 0xC
    # PB24
    mww 0xF40401C0 0xC
    # PB25
    mww 0xF40401C8 0xC
    # PB26
    mww 0xF40401D0 0xC
    # PB27
    mww 0xF40401D8 0xC
    # PB28
    mww 0xF40401E0 0xC
    # PB29
    mww 0xF40401E8 0xC
    # PB30
    mww 0xF40401F0 0xC
    # PB31
    mww 0xF40401F8 0xC

    # femc configuration
    mww 0xF3050000 0x1
    sleep 10
    mww 0xF3050000 0x2
    mww 0xF3050008 0x30524
    mww 0xF305000C 0x6030524
    mww 0xF3050000 0x10000000

    # 32MB
    mww 0xF3050010 0x4000001b
    mww 0xF3050014 0
    # 16-bit
    mww 0xF3050040 0xf31

    # 166Mhz configuration
    mww 0xF3050044 0x884e33

    mww 0xF3050048 0x1020d0d
    mww 0xF3050048 0x1020d0d
    mww 0xF305004C 0x2020300

    # config delay cell
    mww 0xF3050150 0x3b
    mww 0xF3050150 0x203b

    mww 0xF3050094 0
    mww 0xF3050098 0

    # precharge all
    mww 0xF3050090 0x40000000
    mww 0xF305009C 0xA55A000F
    sleep 500
    mww 0xF305003C 0x3
    # auto refresh
    mww 0xF305009C 0xA55A000C
    sleep 500
    mww 0xF305003C 0x3
    mww 0xF305009C 0xA55A000C
    sleep 500
    mww 0xF305003C 0x3

    # set mode
    mww 0xF30500A0 0x33
    mww 0xF305009C 0xA55A000A
    sleep 500
    mww 0xF305003C 0x3

    mww 0xF305004C 0x2020301
    echo "SDRAM has been initialized"
}

$_TARGET0 configure -event reset-init {
    #init_clock
    #init_sdram
}

$_TARGET0 configure -event gdb-attach {
    reset halt
}
